name: Verify website and document templates

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Astro, links and Writer templates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Validate general Writer templates
        run: python3 scripts/import-general-writer-templates.py --check
      - name: Install dependencies
        run: npm ci
      - name: Validate content data
        run: npm run validate:content
      - name: Check Astro and TypeScript
        run: npx astro check
      - name: Build static website
        run: npm run build
      - name: Validate output and links
        run: node scripts/validate-site.mjs
      - name: Upload verified site for Pages
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    name: Publish verified site
    needs: verify
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    concurrency:
      group: github-pages
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
