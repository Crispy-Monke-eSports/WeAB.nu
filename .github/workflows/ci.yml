name: Verify website and document templates

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    name: Astro, links and Writer templates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Validate general Writer templates
        run: python3 scripts/import-general-writer-templates.py --check
      - name: Install Scribble PDF test dependencies
        run: python3 -m pip install -r documents/templates/scribble/requirements.txt
      - name: Validate Scribble JSON templates
        run: python3 documents/templates/scribble/tools/validate_books.py
      - name: Test Scribble to PDF fidelity and independent pagination
        run: python3 -m unittest discover -s documents/templates/scribble/tools -p 'test_books.py' -v
      - name: Export ten paired Scribble JSON and A4 PDFs
        run: python3 documents/templates/scribble/tools/export_pairs.py /tmp/weab-scribble-pairs
      - name: Validate WeRule citizenship Scribble and Writer templates
        run: |
          python3 documents/templates/scribble/tools/validate_books.py --strict-layout documents/templates/scribble/companies/WeRule/Medborgarskapsbevis.json
          python3 documents/templates/scribble/tools/verify_werule_citizenship.py
      - name: Install dependencies
        run: npm ci
      - name: Validate content data
        run: npm run validate:content
      - name: Check Astro and TypeScript
        run: npx astro check
      - name: Build static website
        run: npm run build
      - name: Validate output and links
        run: node scripts/validate-site.mjs
