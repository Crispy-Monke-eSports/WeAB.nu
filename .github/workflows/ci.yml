name: Verify website

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    name: Astro build and link check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        run: npm ci
      - name: Validate content data
        run: npm run validate:content
      - name: Check Astro and TypeScript
        run: npx astro check
      - name: Build static website
        run: npm run build
      - name: Validate output and links
        run: node scripts/validate-site.mjs
