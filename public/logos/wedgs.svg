  <title id="logo-title">WE – WeDGS</title>
  <desc id="logo-desc">Separerade vita pixelbokstäver W och E mot färgad skylt med utåtvända, trappstegsformade stenhörn.</desc>
  <!-- BYT DOTTERBOLAGSFÄRG: ändra endast fill på path#brand-color. -->
  <defs>
    <linearGradient id="brand-shading" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity=".085"/>
      <stop offset=".52" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="1" stop-color="#000000" stop-opacity=".14"/>
    </linearGradient>
  </defs>
  <style>
    .letter-shadow { fill: #2A1818; opacity: .24; }
    .letter-extrusion { fill: #C9C2BD; }
  </style>
